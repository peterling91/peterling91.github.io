<html>
  <body>
    <div
      class="nyp-corp-floating-action-button aem-GridColumn aem-GridColumn--default--12"
    >
      <!--start of animation stuff-->
      <button
        class="click-me-container"
        data-dialog=""
        data-dialog-target="giveaways"
      >
        <span class="visually-hidden">Play sticker mini game</span>
        <video
          id="clickMeVideo"
          autoplay=""
          loop=""
          muted=""
          playsinline=""
          disablepictureinpicture=""
          poster="/img/Click_me_for_surprise.webp"
          width="1440"
          height="640"
          class="click-me lazyvideo"
        >

        </video>
      </button>
      <script>
      const video = document.getElementById("clickMeVideo");
    
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
      if (isIOS) {
        const mp4Source = document.createElement("source");
        mp4Source.src = "/img/Click_me_for_surprise.mp4";
        mp4Source.type = "video/mp4";
        video.appendChild(mp4Source);
      } else {
        const webmSource = document.createElement("source");
        webmSource.src = "/img/Click_me_for_surprise.webm";
        webmSource.type = "video/webm";
        video.appendChild(webmSource);
      }
    
      // Optional: Reload the video to apply the new source
      video.load();
    </script>
      <!-- Dialog -->
      <dialog
        class="dialog max-w-container border-0"
        id="giveaways"
        style="max-height: calc(-32px + 100dvh)"
      >
        <form
          class="dialog-content bg-primary-700"
          name="Suprise"
          style="
            min-height: calc(0px + 100dvh);
            max-height: calc(-32px + 100dvh);
          "
        >
          <div class="dialog-header justify-end bg-white border-0">
            <button
              class="dialog-close-button button-white-grey button-icon button-sm"
            >
              <span class="visually-hidden">Close</span>
              <i class="fa-regular fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <div class="dialog-body">
            <div class="dialog-body-content bg-white">
              <div class="space-y-6">
                <div id="nyp-corp-container-b45f683a9d" class="cmp-container">
                  <div class="aem-Grid aem-Grid--12 aem-Grid--default--12">
                    <div
                      class="nyp-corp-centered-container nyp-corp-container container responsivegrid aem-GridColumn aem-GridColumn--default--12"
                    >
                      <section>
                        <div class="space-y-4 mx-auto px-6 max-w-container-p">
                          <div
                            id="nyp-corp-centered-container-6f1b49877e"
                            class="cmp-container"
                          >
                            <div
                              class="aem-Grid aem-Grid--12 aem-Grid--default--12"
                            >
                              <div
                                class="nyp-corp-image-webp aem-GridColumn aem-GridColumn--default--12"
                              >
                                <img
                                  src="/content/dam/nypcorp/sg/en/eae/exclusive2.webp"
                                  loading="lazy"
                                  class="cmp-image__image"
                                  itemprop="contentUrl"
                                />
                              </div>
                              <div
                                class="nyp-corp-spacer aem-GridColumn aem-GridColumn--default--12"
                              >
                                <div class="component-spacing"></div>

                                <div class="component-spacing"></div>
                              </div>
                              <div
                                class="nyp-corp-multiple-buttons aem-GridColumn aem-GridColumn--default--12"
                              >
                                <div
                                  class="flex flex-wrap gap-4 justify-center"
                                >
                                  <a
                                    class="button-primary external-link"
                                    href="https://www.instagram.com/nanyangpoly/"
                                    target="_blank"
                                  >
                                    <span>Follow us on Instagram</span>

                                    <span class="visually-hidden">Go to</span>
                                    <span class="cmp-link__screen-reader-only"
                                      >opens in a new tab</span
                                    ></a
                                  >

                                  <a
                                    class="button-primary external-link"
                                    href="https://www.tiktok.com/@nanyangpoly?lang=en"
                                    target="_blank"
                                  >
                                    <span>Follow us on TikTok</span>

                                    <span class="visually-hidden">Go to</span>
                                    <span class="cmp-link__screen-reader-only"
                                      >opens in a new tab</span
                                    ></a
                                  >
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </section>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </dialog>
      <!--end of animation stuff-->
    </div>
  </body>
</html>
